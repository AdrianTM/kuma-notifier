<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kuma Notifier</title><link rel="stylesheet" href="style.css"></head>
<body class="popup"><header><div class="brand"><img src="icons/icon-48.png" alt="" width="32" height="32"><div><strong>Kuma Notifier</strong><span id="instance" class="muted">Your uptime, at a glance</span></div></div><div class="header-actions"><button id="snooze" class="subtle" hidden>Snooze alerts · 1h</button><button id="settings" class="subtle">Settings</button></div></header>
<main><section id="welcome" hidden><h1>Keep an eye on your services.</h1><p>Connect your Uptime Kuma instance or a published status page to see monitor health here.</p><button id="connect" class="primary">Connect to Kuma</button></section>
<section id="connected" hidden><div id="summary" class="summary"></div><p id="connection" role="status" class="notice" hidden></p><div class="filters"><input id="search" type="search" aria-label="Search monitors" placeholder="Search monitors…"><select id="filter" aria-label="Filter status"><option value="all">All monitors</option><option value="problems">Problems</option><option value="up">Up</option><option value="paused">Paused</option><option value="maintenance">Maintenance</option></select></div><ul id="monitors" class="monitors"></ul><p id="empty" class="muted" hidden>No monitors match.</p><footer><span id="updated" class="muted"></span><button id="refresh" class="subtle">Refresh</button></footer><div class="actions"><button id="dashboard" class="subtle">Open Kuma ↗</button></div></section>
<p id="error" class="error" role="alert" hidden></p></main><script src="popup.js"></script></body></html>
